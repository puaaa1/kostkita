<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reservasi Kos - KostKita</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/booking.css">
</head>
<body class="bk-body">
  <div class="app bk-app">
    <main class="bk-konten">
      <div class="bk-judul">
        <a href="detail.html" class="bk-kembali" id="kembali" data-ikon="back"></a>
        <h2>Reservasi Kos</h2>
      </div>

      <div class="bk-langkah">
        <div class="aktif"><i></i><span>1. Data booking</span></div>
        <div><i></i><span>2. Pembayaran</span></div>
        <div><i></i><span>3. Konfirmasi</span></div>
      </div>

      <section class="bk-kartu bk-kos">
        <div class="bk-foto"></div>
        <div>
          <strong id="namaKos">Kos</strong>
          <p id="infoKos"></p>
        </div>
      </section>

      <section class="bk-kartu">
        <h3>Tanggal dan durasi sewa</h3>
        <label class="bk-label" for="mulai">Tanggal masuk</label>
        <div class="bk-tanggal">
          <input type="text" class="bk-input" id="mulai" placeholder="dd/mm/yyyy" inputmode="numeric" maxlength="10" autocomplete="off">
          <input type="date" class="bk-tanggal-asli" id="pilihTanggal" tabindex="-1" aria-hidden="true">
        </div>

        <label class="bk-label">Durasi sewa</label>
        <div class="bk-durasi" id="durasi">
          <button type="button" data-bulan="1">1 bln</button>
          <button type="button" data-bulan="3">3 bln</button>
          <button type="button" data-bulan="6">6 bln</button>
          <button type="button" data-bulan="12">12 bln</button>
        </div>
      </section>

      <section class="bk-kartu">
        <h3>Data penyewa</h3>
        <label class="bk-label" for="nama">Nama lengkap</label>
        <input type="text" class="bk-input" id="nama" placeholder="Sesuai identitas" autocomplete="name">

        <label class="bk-label" for="hp">No. HP (WhatsApp)</label>
        <input type="tel" class="bk-input" id="hp" placeholder="08xx xxxx xxxx" autocomplete="tel">

        <label class="bk-label" for="kampus">Kampus dan jurusan</label>
        <input type="text" class="bk-input" id="kampus" placeholder="Contoh: UB, Teknik Informatika">
      </section>
    </main>

    <div class="bk-bawah">
      <div>
        <small>DP yang dibayar</small>
        <b id="dp">Rp0</b>
      </div>
      <button type="button" class="bk-tombol" id="lanjut">Lanjut ke Pembayaran</button>
    </div>
  </div>

  <script src="js/icons.js"></script>
  <script src="js/data-kos.js"></script>
  <script src="js/booking.js"></script>
  <script src="js/reservasi.js"></script>
</body>
</html>
